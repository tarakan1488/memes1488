<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>😹 Галерея Мемів</h1>
    </header>

    <main>
        <!-- Форма для додавання мема -->
        <section class="add-meme-section">
            <h2>Додати новий мем</h2>
            <form id="addMemeForm">
                <input type="text" id="title" placeholder="Назва мема" required>
                <input type="url" id="imageUrl" placeholder="URL картинки" required>
                <input type="text" id="category" placeholder="Категорія (наприклад, IT)" required>
                <button type="submit">Додати мем</button>
            </form>
        </section>

        <!-- Фільтри -->
        <section class="controls">
            <select id="categoryFilter">
                <option value="">Всі категорії</option>
            </select>
            <select id="sortFilter">
                <option value="desc">Спочатку нові</option>
                <option value="asc">Спочатку старі</option>
            </select>
            <button id="loadBtn" onclick="fetchMemes()">Оновити галерею</button>
        </section>

        <!-- Галерея -->
        <section class="gallery" id="gallery">
            <!-- Меми будуть додаватися сюди через JS -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
